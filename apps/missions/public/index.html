<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alfred.report Missions</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; color: #f48120; }
    header .status { font-size: 12px; color: #666; margin-left: auto; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 720px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .msg.user { background: #1a1a2e; align-self: flex-end; }
    .msg.assistant { background: #161616; border: 1px solid #222; align-self: flex-start; }
    .msg.system { background: #1a1a1a; color: #888; font-size: 12px; font-style: italic; }
    #input-bar {
      padding: 16px 24px;
      background: #111;
      border-top: 1px solid #222;
      display: flex;
      gap: 12px;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
    }
    #input:focus { border-color: #f48120; }
    #send {
      padding: 12px 24px;
      background: #f48120;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    #send:hover { background: #ff9a3c; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    .commands {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 24px 8px;
      background: #111;
    }
    .cmd {
      padding: 4px 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 12px;
      color: #888;
      cursor: pointer;
    }
    .cmd:hover { border-color: #f48120; color: #f48120; }
  </style>
</head>
<body>
  <header>
    <h1>Alfred</h1>
    <span class="status">Alfred.report Missions</span>
  </header>
  <div id="chat"></div>
  <div class="commands">
    <span class="cmd" onclick="sendCmd('/briefing')">/briefing</span>
    <span class="cmd" onclick="sendCmd('/maintenance')">/maintenance</span>
    <span class="cmd" onclick="sendCmd('/curate')">/curate</span>
    <span class="cmd" onclick="sendCmd('/clean')">/clean</span>
    <span class="cmd" onclick="sendCmd('/distill')">/distill</span>
    <span class="cmd" onclick="sendCmd('/farm')">/farm</span>
    <span class="cmd" onclick="sendCmd('/stats')">/stats</span>
  </div>
  <div id="input-bar">
    <input id="input" type="text" placeholder="Message Alfred..." autocomplete="off" />
    <button id="send" onclick="send()">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let ws = null;
    let connected = false;

    function addMsg(text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/chat`);

      ws.onopen = () => {
        connected = true;
        addMsg('Connected to Alfred. Type a message or use a command.', 'system');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'text') {
            addMsg(data.content, 'assistant');
          } else if (data.type === 'error') {
            addMsg('Error: ' + data.content, 'system');
          }
        } catch {
          addMsg(event.data, 'assistant');
        }
      };

      ws.onclose = () => {
        connected = false;
        addMsg('Disconnected. Reconnecting...', 'system');
        setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        addMsg('Connection error.', 'system');
      };
    }

    function send() {
      const text = input.value.trim();
      if (!text || !connected) return;
      addMsg(text, 'user');
      ws.send(JSON.stringify({ type: 'message', content: text }));
      input.value = '';
    }

    function sendCmd(cmd) {
      input.value = cmd;
      send();
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });

    connect();
  </script>
</body>
</html>

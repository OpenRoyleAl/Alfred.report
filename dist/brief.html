<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Brief — Alfred.report</title>
  <meta name="description" content="Hear the demo brief. Then gone." />
  <link rel="canonical" href="https://alfred.report/brief" />
  <link rel="stylesheet" href="/fonts.css?v=2" />
  <link rel="stylesheet" href="/landing.css?v=26" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
</head>
<body>
  <header class="top">
    <a class="brand brand-al" href="/" aria-label="Alfred.report">
      <span class="al-mark">Al</span>
    </a>
    <nav>
      <a class="nav-keep" href="/board">Board</a>
      <a class="nav-quiet" href="/auth/google">Sign in</a>
      <a class="top-cta go-max" href="/auth/google">Go Max <span class="al-mark">Al</span><span class="ex">!</span></a>
    </nav>
  </header>
  <section class="band">
    <h2>Brief</h2>
    <p class="lede">Hear it. Then gone. The board keeps the work.</p>
    <div class="say-row">
      <span class="click-cue" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 2.2 18.6 14l-5.4 1.2 3.6 7.2-2.8 1.4-3.6-7.2L4 19.2V2.2z"/></svg></span>
      <button type="button" class="say-cta" id="brief-play">Hear the brief<span class="bang">!</span></button>
    </div>
    <audio id="brief-player" preload="none"></audio>
  </section>
  <footer class="foot">
    <a class="brand" href="https://openroyleal.com">
      <span class="word">OpenRoyle</span><span class="al-mark">Al</span>
    </a>
    <a class="icon-link" href="https://github.com/OpenRoyleAl" aria-label="OpenRoyleAl on GitHub" title="OpenRoyleAl on GitHub">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.26c0 4.52 2.87 8.35 6.84 9.71.5.1.68-.22.68-.49 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.36 1.12 2.94.86.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 6.84c.85 0 1.7.12 2.5.34 1.9-1.32 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.38-.01 2.49-.01 2.83 0 .27.18.59.69.49A10.03 10.03 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/></svg>
    </a>
  </footer>
  <script>
    const btn = document.getElementById("brief-play");
    const player = document.getElementById("brief-player");
    btn.addEventListener("click", async () => {
      btn.classList.add("armed");
      player.src = "/voice/demo-brief";
      try { await player.play(); }
      catch { btn.textContent = "Allow audio, then tap again."; }
    });
    player.addEventListener("ended", () => {
      btn.classList.remove("armed");
      btn.innerHTML = 'Hear the brief<span class="bang">!</span>';
    });
  </script>
</body>
</html>

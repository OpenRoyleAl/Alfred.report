<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign in · Alfred.report!</title>
  <meta name="description" content="Sign in to Alfred.report. Your Alfred, your report." />
  <link rel="canonical" href="https://alfred.report/login" />
  <meta name="theme-color" content="#070708" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/ds.css?v=1" />
  <link rel="stylesheet" href="/site.css?v=2" />
  <script src="/brand.js?v=1"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" aria-label="Home"><span class="wm" data-brand>Alfred.report!</span></a>
    <span class="sp"></span>
    <nav aria-label="Primary">
      <a class="btn ghost sm hide-xs" href="/oral">ORAL</a>
      <a class="btn ghost sm hide-xs" href="/go-max">Go Max AI!</a>
      <a class="btn sm" href="/signup">Get started</a>
    </nav>
  </header>
  <main class="auth">
    <section class="auth-card glass" aria-labelledby="h">
      <img src="/logo.svg" alt="" width="44" height="44">
      <h1 id="h">Sign in to <span data-brand-text>Alfred.report!</span></h1>
      <p class="muted">Your Sovereign Custodian is waiting with The Report.</p>
      <div class="stack">
        <button id="google-btn" class="btn gbtn" onclick="signInGoogle()"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Sign in with Google</button>
        <p id="err" class="name-status no" hidden role="alert"></p>
        <div class="sep">new here</div>
        <a class="btn" href="/signup">Claim your name.report!</a>
      </div>
    </section>
  </main>
  <footer class="site-foot">
    <a href="/terms">Terms</a>
    <span>A product of <a href="https://openroyleal.com">OpenRoyleAl</a> · <a href="https://github.com/OpenRoyleAl/Alfred.report">GitHub</a></span>
    <a href="/privacy">Privacy</a>
  </footer>
  <script>
    async function signInGoogle() {
      const btn = document.getElementById("google-btn");
      const err = document.getElementById("err");
      err.hidden = true;
      btn.disabled = true;
      btn.textContent = "Connecting...";
      
      try {
        const cb = new URLSearchParams(location.search).get("next") || "/home";
        const res = await fetch("/api/auth/google/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ callbackURL: cb.startsWith("/") && !cb.startsWith("//") && !cb.includes("\\") ? cb : "/home" }),
        });
        const data = await res.json();
        if (data.url) {
          location.href = data.url;
        } else {
          err.textContent = data.error || "Failed to start sign-in";
          err.hidden = false;
          btn.disabled = false;
          btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" style="margin-right:10px;vertical-align:middle"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Sign in with Google';
        }
      } catch (e) {
        err.textContent = "Network error. Try again.";
        err.hidden = false;
        btn.disabled = false;
        btn.textContent = "Sign in with Google";
      }
    }
  </script>
</body>
</html>

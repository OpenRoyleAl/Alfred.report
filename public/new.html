<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New mission · Alfred.report!</title>
  <meta name="theme-color" content="#070708" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/ds.css?v=1" />
  <link rel="stylesheet" href="/board.css?v=2" />
  <script src="/brand.js?v=1"></script>
  <style>
    .newm{max-width:680px;margin:20px auto 140px;padding:clamp(18px,4vw,28px)!important;position:relative;z-index:1;border-radius:22px!important}
    .newm h1{font:600 26px/1.2 var(--sans)!important;letter-spacing:-.02em}
    .agent-grid{display:grid;gap:8px;margin:10px 0 0}@media(min-width:600px){.agent-grid{grid-template-columns:1fr 1fr}}
    .agent-grid>*{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--glass);color:var(--fg);cursor:pointer;font:400 14px/1.35 var(--sans)}
    .agent-grid>*[aria-checked="true"],.agent-grid>*.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
    .agent-grid small,.agent-grid .desc{display:block;color:var(--fg3);font-size:12px;margin-top:4px}
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" aria-label="Board"><span class="wm" data-brand>Alfred.report!</span></a>
    <span class="sp"></span>
    <nav aria-label="Primary"><a class="btn ghost sm" href="/"><svg class="ic"><use href="#i-back"/></svg>Board</a></nav>
  </header>

  <main class="sheet glass newm">
    <h1 style="font-size:1.35rem;margin:0 0 .75rem">Open mission</h1>
    <p class="hint" style="margin-top:0">Say it in one sentence. Alfred plans it, runs it to proof, and reports back. Say <strong>Go Max AI!</strong> to start a mission by voice.</p>

    <label for="objInput">Objective (one sentence)</label>
    <textarea id="objInput" placeholder="What needs to ship?" maxlength="2000"></textarea>

    <label for="accInput">Acceptance (optional, one per line)</label>
    <textarea id="accInput" placeholder="done when…" maxlength="4000"></textarea>

    <p class="eyebrow" style="margin:18px 0 0">Field agent</p>
    <div class="agent-grid" id="agentGrid" role="radiogroup" aria-label="Field agent"></div>

    <div class="rowbtns">
      <a class="btn ghost" href="/" style="text-decoration:none;display:inline-flex;align-items:center">Cancel</a>
      <button type="button" class="btn primary" id="saveBtn">Open mission</button>
    </div>
    <p class="err" id="err" style="display:none"></p>
    <p class="hint" id="holdHint" style="display:none"></p>
  </main>

<script>
const AGENTS = [
  { id:"alfred", name:"Alfred (this instance)", desc:"The Alfred agent on your Cloudflare account. Best default.", rec:true },
  { id:"cursor", name:"Cursor", desc:"External coding agent that claims the mission over A2A." },
  { id:"pi", name:"Pi", desc:"External Pi harness over A2A." },
  { id:"grok-cli", name:"Grok CLI", desc:"External Grok CLI over A2A." },
  { id:"openclaw", name:"OpenClaw", desc:"External OpenClaw agent over A2A." },
  { id:"hermes", name:"Hermes Agent", desc:"External Hermes agent over A2A." },
  { id:"mimocode", name:"MiMoCode", desc:"External MiMoCode agent over A2A." },
];

const grid = document.getElementById("agentGrid");
AGENTS.forEach((a,i) => {
  const lab = document.createElement("label");
  lab.className = "agent-opt";
  lab.innerHTML = '<input type="radio" name="field_agent" value="'+a.id+'" '+(a.rec||i===0?"checked":"")+' />'
    + '<div><div class="name">'+a.name+(a.rec?'<span class="badge">default</span>':'')+'</div>'
    + '<div class="desc">'+a.desc+'</div></div>';
  grid.appendChild(lab);
});

async function refreshHold(){
  try{
    const r=await fetch("/api/stats",{credentials:"same-origin"});
    if(!r.ok) return;
    const s=await r.json();
    if(s.hold_new_missions){
      document.getElementById("holdHint").style.display="block";
      document.getElementById("holdHint").textContent="New missions held — metering gate. Close the loop before opening more.";
      document.getElementById("saveBtn").disabled=true;
    }
  }catch(_){}
}
refreshHold();
const pre=sessionStorage.getItem("alfred_voice_objective");
if(pre){ document.getElementById("objInput").value=pre; sessionStorage.removeItem("alfred_voice_objective"); }
// Voice-first on /new
(function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=document.createElement("button");
  btn.type="button"; btn.className="btn ghost"; btn.textContent="Dictate";
  btn.style.marginTop=".5rem";
  document.getElementById("objInput").insertAdjacentElement("afterend", btn);
  btn.onclick=function(){
    if(!SR){ alert("Voice not supported here"); return; }
    const r=new SR(); r.lang="en-GB";
    btn.textContent="Listening…";
    r.onresult=function(ev){
      const t=Array.from(ev.results).map(x=>x[0].transcript).join(" ").trim();
      const el=document.getElementById("objInput");
      el.value=(el.value?el.value+" ":"")+t;
      btn.textContent="Dictate";
    };
    r.onerror=function(){ btn.textContent="Dictate"; };
    r.onend=function(){ btn.textContent="Dictate"; };
    r.start();
  };
})();

document.getElementById("saveBtn").onclick=async function(){
  const objective=document.getElementById("objInput").value.trim();
  const accRaw=document.getElementById("accInput").value.trim();
  const err=document.getElementById("err");
  const fa=(document.querySelector('input[name="field_agent"]:checked')||{}).value||"cursor";
  if(!objective){ err.textContent="Objective required."; err.style.display="block"; return; }
  const body={ objective, field_agent: fa };
  if(accRaw) body.acceptance=accRaw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  this.disabled=true; err.style.display="none";
  try{
    // One client requestId per form: a double click or retried submit is the same mission.
    window.__missionRid=window.__missionRid||("board-"+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)));
    body.requestId=window.__missionRid;
    const r=await fetch("/api/missions",{
      method:"POST", credentials:"same-origin",
      headers:{"Content-Type":"application/json","Accept":"application/json","Idempotency-Key":window.__missionRid},
      body:JSON.stringify(body)
    });
    const data=await r.json().catch(()=>({}));
    if(r.ok) window.__missionRid=null;
    if(!r.ok) throw new Error(data.message||data.error||("Create failed "+r.status));
    const id=data.id||data.mission_id||(data.mission&&data.mission.id);
    if(id) location.href="/m/"+encodeURIComponent(id);
    else location.href="/";
  }catch(e){
    err.textContent=e.message||String(e); err.style.display="block";
  }finally{ this.disabled=false; }
};
document.getElementById("objInput").addEventListener("input",()=>{ window.__missionRid=null; });
</script>
<script src="/alfred-voice.js?v=3" defer></script>
</body>
</html>
